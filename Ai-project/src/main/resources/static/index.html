<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Career Assistant</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 20px; }
        #upload-section, #chat-section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        #messages { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; max-height: 400px; overflow-y: auto; }
        .msg { padding: 10px 14px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
        .user { background: #DCF2FF; align-self: flex-end; }
        .bot { background: #F0F0F0; align-self: flex-start; }
        #chat-input { width: 75%; padding: 8px; }
        button { padding: 8px 14px; cursor: pointer; }
        #status { font-size: 13px; color: #666; margin-top: 6px; }
    </style>
</head>
<body>

<h1>🎯 AI Career Assistant</h1>

<div id="upload-section">
    <strong>Step 1: Upload your resume</strong><br><br>
    <input type="file" id="resumeFile" accept=".pdf,.doc,.docx" />
    <button onclick="uploadResume()">Upload</button>
    <div id="uploadStatus" style="margin-top:8px; font-size: 13px;"></div>
</div>

<div id="chat-section">
    <strong>Step 2: Chat</strong>
    <div id="messages"></div>
    <input id="chat-input" type="text" placeholder="e.g. Analyze my fit for this job: ..." />
    <button onclick="sendMessage()">Send</button>
    <div id="status"></div>
</div>

<script>
    const conversationId = "session-" + Date.now();

    async function uploadResume() {
      const fileInput = document.getElementById("resumeFile");
      if (!fileInput.files.length) {
        alert("Choose a file first");
        return;
      }
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      document.getElementById("uploadStatus").innerText = "Uploading...";

      const res = await fetch("/api/resume/upload", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      document.getElementById("uploadStatus").innerText = data.message;
    }

    function addMessage(text, sender) {
      const messages = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = "msg " + sender;
      div.innerText = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      document.getElementById("status").innerText = "Thinking...";

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversationId: conversationId, message: message })
      });
      const data = await res.json();

      addMessage(data.answer, "bot");
      document.getElementById("status").innerText = "";
    }

    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
